<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="senmon-build" content="taiken">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>センモン大冒険 体験版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet">
<style>
/* 2D の見た目：A 縫い目の絵本（本人決定 2026-10-23）。生成り・藍・茜・からし・若草。枠はなみ縫いの縫い目。地は生成りより明るいクリーム色（本人 2026-10-24「生成りが濃すぎる」→ 案内板もウィンドウにそろえる） */
:root { --kinari:#fdf8e6; --ai:#2e3a59; --akane:#c8553d; --karashi:#d9a441; --wakakusa:#7fa650; --kinari2:#e8dcc0; }
html, body { margin:0; height:100%; overflow:hidden; background:#cfeeff; font-family:"Zen Maru Gothic",sans-serif; color:var(--ai); }
#stage { position:fixed; inset:0; }
#stage canvas { display:block; width:100%; height:100%; touch-action:none; }
.panel { position:fixed; background:var(--kinari); border-radius:6px; padding:8px 12px; font-size:14px; outline:2px dashed rgba(46,58,89,.55); outline-offset:-5px; }
.ttl { font-family:"Yusei Magic",sans-serif; font-weight:400; }
#place { left:12px; top:12px; background:var(--wakakusa); color:#fff; outline-color:rgba(255,255,255,.85); }
#place small { display:block; font-size:12px; color:#f0f6e8; }
#quest { right:12px; top:12px; max-width:300px; }
#quest b { color:var(--akane); }
#party { left:12px; bottom:12px; display:flex; gap:8px; align-items:center; }
.qkind { display:inline-block; font-size:12px; padding:1px 8px; border-radius:4px; background:var(--kinari2); margin-right:6px; }
.qtag { display:inline-block; margin:6px 0; padding:8px 18px 8px 26px; background:#fff; border:1.5px solid #b9b2a0; border-radius:3px; font-size:15px; position:relative; }
.qtag::before { content:''; position:absolute; left:9px; top:50%; width:8px; height:8px; margin-top:-4px; border-radius:50%; border:1.5px solid #b9b2a0; }
.qopts { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.qopts button { min-width:72px; }
.qsteps { font-size:12px; color:#5a6582; }
#party button { font-size:12px; padding:4px 9px; margin-left:4px; }
.boxst { font-size:12px; text-align:center; }
#party img { width:42px; height:42px; border-radius:50%; border:2px dashed var(--ai); background:#fff; cursor:pointer; }
#btns { right:12px; bottom:12px; display:flex; gap:8px; padding:8px; }
button { font:inherit; font-size:14px; background:var(--kinari); border:none; border-radius:4px; padding:7px 13px; cursor:pointer; color:var(--ai); outline:2px dashed rgba(46,58,89,.6); outline-offset:-4px; }
button:hover { background:var(--kinari2); }
button.main { background:var(--akane); color:#fff; outline-color:rgba(255,255,255,.85); }
button.main:hover { background:#b4492f; }
#prompt { left:50%; bottom:76px; transform:translateX(-50%); display:none; background:var(--akane); color:#fff; outline-color:rgba(255,255,255,.85); cursor:pointer; }
#help { left:50%; top:12px; transform:translateX(-50%); font-size:12px; white-space:nowrap; }
#overlay { position:fixed; inset:0; background:rgba(46,58,89,.35); display:none; align-items:center; justify-content:center; }
/* ウィンドウ＝手縫いの布（本人 2026-10-24「世界観にあった手縫い感」）：クリーム色の布目（生成りは濃いと本人）・ピンキングばさみの上下・茜の糸のなみ縫い・名前テープの見出し */
#sheetWrap, .homeCard { --th:rgba(200,85,61,.8); --z:12px; position:relative; width:min(560px,92vw); max-height:88vh; display:flex; padding:12px 8px;
  background-color:var(--kinari);
  background-image:repeating-linear-gradient(0deg, rgba(150,120,60,.045) 0 1px, transparent 1px 4px), repeating-linear-gradient(90deg, rgba(150,120,60,.035) 0 1px, transparent 1px 4px);
  -webkit-mask:conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / var(--z) 51% repeat-x, conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / var(--z) 51% repeat-x;
          mask:conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / var(--z) 51% repeat-x, conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / var(--z) 51% repeat-x; }
#sheetWrap::before, .homeCard::before { content:''; position:absolute; inset:14px 9px; pointer-events:none;
  background:linear-gradient(90deg, var(--th) 58%, transparent 0) top / 14px 2px repeat-x, linear-gradient(90deg, var(--th) 58%, transparent 0) bottom / 14px 2px repeat-x,
    linear-gradient(0deg, var(--th) 58%, transparent 0) left / 2px 14px repeat-y, linear-gradient(0deg, var(--th) 58%, transparent 0) right / 2px 14px repeat-y; }
#sheet { width:100%; box-sizing:border-box; max-height:calc(88vh - 24px); overflow:auto; padding:16px 20px; }   /* 余白を 幅に ふくめる（中身が 右へ はみ出していた） */
#sheet h2 { display:inline-block; margin:0 0 6px; padding:3px 14px; font-size:20px; font-family:"Yusei Magic",sans-serif; font-weight:400; background:#fff;
  border-top:2px dashed var(--th); border-bottom:2px dashed var(--th); }
.patch { display:inline-block; width:22px; height:22px; border-radius:3px; vertical-align:-4px; margin-right:6px; outline:1.5px dashed rgba(255,255,255,.95); outline-offset:-4px; }
#sheet .sub { font-size:14px; line-height:1.7; color:#5a6582; margin:0 0 10px; }
table.tb { border-collapse:collapse; font-size:13px; width:100%; background:#fffdf6; }
table.tb th, table.tb td { border:1px dashed rgba(46,58,89,.6); padding:4px 6px; text-align:left; font-weight:400; }
table.tb th { background:var(--kinari2); white-space:nowrap; }
/* フォーメーション：肌から順に布を重ねた図（本人 2026-10-24「表にはめていくのは大変わかりづらい」） */
#sheetWrap.wide { width:min(800px,94vw); }
.fwrap { display:grid; grid-template-columns:230px minmax(0,1fr); grid-template-areas:"guide guide" "torso layers" "hand hand"; gap:8px 14px; margin:6px 0; }
.fwrap .guide { grid-area:guide; }
.ftorso { grid-area:torso; }
.fleft { grid-area:layers; min-width:0; }
.fright { grid-area:hand; display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:6px; }
@media (max-width:640px) { .fwrap { grid-template-columns:minmax(0,1fr); grid-template-areas:"guide" "torso" "layers" "hand"; } .ftorso svg { max-width:170px; } }
/* トルソー（上半身の服の台）：外側＝上着・肌側＝肌着。えらんだ服が点滅する（本人 2026-10-24） */
.ftorso svg { display:block; width:100%; max-width:230px; height:auto; margin:0 auto; }
.tcap { margin:2px 0 0; font-size:12px; color:#5a6582; text-align:center; }
.torso .gp { stroke:rgba(46,58,89,.7); stroke-width:2.4; stroke-linejoin:round; }
.torso .gs { fill:none; stroke:rgba(255,255,255,.9); stroke-width:1; stroke-dasharray:3 2.5; pointer-events:none; }   /* ふちの縫い目 */
.gar.empty .gs, .gar.lock .gs { display:none; }
.gar.empty .gp, .gar.lock .gp { stroke-width:1.5; }
.gar { transition:opacity .2s; }
.gar:not(.lock) { cursor:pointer; }
.gar.empty .gp { stroke-dasharray:5 3; }
.gar.lock { pointer-events:none; }
.gar.lock .gp { stroke:#b9b2a0; stroke-dasharray:4 4; }
.gar.hov .gp, .torso.aim .gar:not(.lock) .gp { stroke:var(--akane); stroke-width:2.5; }
.gar.on .gp { stroke:var(--akane); stroke-width:3; }
.gar.on { animation:gblink .9s ease-in-out infinite; }
.gar.just { animation:gblink .4s ease-in-out 2; }
@keyframes gblink { 50% { opacity:.3; } }
.torso.focus-skin .gar[data-layer="out"], .torso.hov-skin .gar[data-layer="out"], .torso.focus-skin .gar[data-layer="mid"], .torso.hov-skin .gar[data-layer="mid"],
.torso.focus-mid .gar[data-layer="out"], .torso.hov-mid .gar[data-layer="out"] { opacity:.25; }   /* 肌着を えらぶときは、上着を すかして 肌着ぜんぶを 見せる */
.glab { font-size:12px; font-weight:700; fill:var(--ai); stroke:#fff; stroke-width:3px; paint-order:stroke; pointer-events:none; }
.glab.off { fill:#9a9280; }
.glab.sm { font-size:12px; }   /* まん中の字も 読める大きさに（白いふちで 服の線に かかっても 読める） */
@media (prefers-reduced-motion:reduce) { .gar.on, .gar.just { animation:none; } }
.hdemo { display:grid; grid-template-columns:150px minmax(0,1fr); gap:10px; align-items:start; }
.guide { display:flex; align-items:center; gap:6px; margin:0; font-size:13px; background:#fff; border-left:4px solid var(--akane); padding:5px 8px; }
.guide b { color:var(--akane); }
.guide .material-symbols-outlined { font-size:20px; color:var(--akane); }
.board { display:flex; flex-direction:column; gap:5px; }
.edge { display:flex; align-items:center; gap:6px; font-size:12px; color:#5a6582; padding:0 4px; }
.edge .material-symbols-outlined { font-size:18px; }
.edge.body { background:#f6d7bd; color:#7a4b2a; border-radius:4px; padding:5px 8px; }
.layer { background:#fff; border:1.5px dashed rgba(46,58,89,.45); border-radius:6px; padding:6px 8px; }
.layer.pick { border:1.5px solid var(--akane); }
.layer.off { background:transparent; color:#9a9280; font-size:12px; padding:3px 8px; display:flex; align-items:center; gap:6px; }
.layer.off .material-symbols-outlined { font-size:16px; }
.lhead { font-size:12px; color:#5a6582; margin-bottom:5px; }
.lhead b { font-size:15px; color:var(--ai); }
.band { display:flex; gap:4px; height:56px; }
.cell { position:relative; display:flex; align-items:center; gap:6px; padding:0 8px; border:2px dashed rgba(46,58,89,.35); border-radius:4px; background:#fffdf6; font-size:13px; line-height:1.25; cursor:pointer; overflow:hidden; min-width:0; }
.cell.main { flex:65 1 0; }
.cell.mix { flex:35 1 0; }
.cell:hover { background:#fbecc4; }
.cell.fill { border:2px solid rgba(46,58,89,.55); }
.cell.sel { outline:3px solid var(--akane); outline-offset:1px; }
.aiming .cell:not(.dis) { border-color:var(--akane); }   /* センモンを えらんだら、置ける欄を 茜の線に */
.cell.dis { cursor:default; color:#9a9280; }
.cell.dis:hover, .demo .cell:hover { background:#fffdf6; }
.demo .cell { cursor:default; }
.cell small { font-size:12px; color:#5a6582; }
.cell img { width:34px; height:34px; border-radius:50%; border:2px solid #fff; flex:none; }
.cell .pct { position:absolute; right:5px; top:2px; font-size:12px; font-weight:700; color:rgba(46,58,89,.7); }
.cell .x { position:absolute; right:3px; bottom:3px; width:22px; height:22px; padding:0; border-radius:50%; background:rgba(255,255,255,.9); outline:1px solid rgba(46,58,89,.4); outline-offset:0; display:flex; align-items:center; justify-content:center; }
.cell .x .material-symbols-outlined { font-size:15px; }
.lres { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; margin-top:5px; font-size:13px; }
.lres .see { color:#5a6582; font-size:12px; }
.lres s { color:#9a9280; }
.ctag { position:relative; background:#fff; border:1px solid #b9b2a0; border-radius:3px; padding:1px 8px 1px 20px; font-size:12px; }
.ctag::before { content:''; position:absolute; left:7px; top:50%; width:6px; height:6px; margin-top:-3px; border-radius:50%; border:1px solid #b9b2a0; }
.hhead { grid-column:1/-1; margin:0; font-size:13px; font-weight:700; }
.hcard { display:flex; gap:8px; align-items:flex-start; padding:6px 8px; background:#fffdf6; border:1.5px dashed rgba(46,58,89,.45); border-radius:6px; font-size:13px; cursor:pointer; }
.hcard:hover { background:#fbecc4; }
.hcard.sel { outline:3px solid var(--akane); outline-offset:1px; }
.hcard img { width:36px; height:36px; border-radius:50%; flex:none; }
.hs { display:flex; flex-wrap:wrap; gap:2px 8px; font-size:12px; color:#5a6582; margin-top:2px; }
.hs .on { color:var(--ai); font-weight:700; background:#fbecc4; padding:0 3px; }
.where { font-size:12px; color:var(--akane); margin-top:2px; }
td.off { color:#9a9280; }
.sw { display:inline-block; width:12px; height:12px; border:1px solid var(--ai); border-radius:3px; vertical-align:-2px; margin-right:4px; }
.row { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
/* 押しやすさ（本人「使用者に寄り添った表示」・検証 2026-10-25）：窓の中の ボタンは 高さ 40px 以上 */
#sheet button, #home button { min-height:40px; }
#sheet .cell .x { min-height:0; }
/* 縦に長い窓：下の行（足りない こと＋ボタン）を いつも 見えるように */
.sfoot, #sheet.long > .row:last-child { position:sticky; bottom:-16px; z-index:3; margin:12px -20px -16px; padding:8px 20px 14px; background:var(--kinari); border-top:2px dashed rgba(200,85,61,.55); }
.sfoot .row { margin-top:6px; }
.sfoot .need { margin:0; display:flex; align-items:center; gap:5px; font-size:14px; color:var(--ai); }
.sfoot .need .material-symbols-outlined { font-size:20px; color:var(--akane); }
.sfoot .need.ok .material-symbols-outlined { color:#4f8a2c; font-variation-settings:'FILL' 1; }
details.memo > summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:4px; }
details.memo > summary::-webkit-details-marker { display:none; }
details.memo > summary::after { content:'expand_less'; font-family:'Material Symbols Outlined'; font-feature-settings:'liga'; font-size:18px; margin-left:auto; color:#5a6582; }
details.memo:not([open]) > summary::after { content:'expand_more'; }
.dex { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:6px; font-size:13px; }
.dex div { border:1.5px dashed rgba(46,58,89,.5); border-radius:4px; padding:4px 6px; background:#fffdf6; }
.voice { color:var(--akane); margin-top:8px; font-size:16px; line-height:1.8; }   /* せりふは 説明より 大きく（本人 2026-10-25） */
/* チュートリアル：案内のふきだし・1日の道のり（しずく時計）・あそびかた */
.coach { background:#eef5e6; border-radius:4px; padding:8px 11px; margin:6px 0; font-size:15px; line-height:1.75; outline:1.5px dashed rgba(95,158,60,.65); outline-offset:-3px; }
.coach b { color:#4f8a2c; }
/* しずく時計：雲から しずくが落ちると、文字盤の場面が 水で みたされ、縫い針の針が 次の場面へ（本人 2026-10-24「グラフィックで表現した方がわかりやすい」） */
.dclock { display:block; width:100%; max-width:230px; margin:0 auto; overflow:visible; }
.dclock .ms { font-family:'Material Symbols Outlined'; font-feature-settings:'liga'; text-anchor:middle; font-size:18px; fill:#9a9280; }
.dclock .cloud { font-size:40px; fill:#bcd9ee; font-variation-settings:'FILL' 1; }
.dclock .drop { font-size:20px; fill:#3a7ca5; font-variation-settings:'FILL' 1; }
.dclock .drop.go { animation:dcfall .5s ease-in forwards; }
@keyframes dcfall { 80% { opacity:1; } to { transform:translateY(80px); opacity:0; } }
.dclock .rim { fill:#e8dcc0; stroke:rgba(46,58,89,.6); stroke-width:2; }
.dclock .rst { fill:none; stroke:var(--akane); stroke-width:1.4; stroke-dasharray:4 3; }
.dcs { fill:#fffdf6; stroke:rgba(46,58,89,.35); stroke-width:1.5; stroke-dasharray:4 3; }
.dcs.past { fill:#d6eaf7; }
.dcs.now { fill:#8cc3e6; }
.dcs.fresh { animation:dcfill .5s ease .45s both; }
@keyframes dcfill { from { fill:#fffdf6; } }
.dcl .lb { font-size:12px; text-anchor:middle; fill:#9a9280; }
.dcl.past .ms, .dcl.past .lb { fill:var(--ai); }
.dcl.now .ms, .dcl.now .lb { fill:var(--akane); font-weight:700; }
.dclock .hand { transform-box:view-box; transform-origin:110px 140px; transition:transform .6s ease .45s; }
.dclock .ndl { fill:#8a93a6; stroke:#5b6478; stroke-width:.8; }
.dclock .thr { fill:none; stroke:var(--akane); stroke-width:1.6; stroke-linecap:round; }
.dclock .eye { fill:#fffdf6; }
.dclock .btn { fill:var(--karashi); stroke:rgba(46,58,89,.6); stroke-width:1.2; }
.dclock .hole { fill:rgba(46,58,89,.6); }
.dcnow { text-align:center; font-size:13px; margin:2px 0 0; }
.dcnow b { color:var(--akane); }
.tripwrap { display:grid; grid-template-columns:240px minmax(0,1fr); gap:14px; align-items:start; }
.tclock { position:sticky; top:0; }
.tbtn { display:flex; justify-content:center; margin-top:8px; text-align:center; }
.tbtn button { display:inline-flex; align-items:center; gap:4px; font-size:15px; padding:9px 16px; }
.tbtn .material-symbols-outlined { font-size:20px; font-variation-settings:'FILL' 1; }
.hclock { max-width:220px; margin:6px auto; }
@media (max-width:640px) { .tripwrap { grid-template-columns:minmax(0,1fr); } .tclock { position:static; } .dclock { max-width:190px; } }
@media (prefers-reduced-motion:reduce) { .dclock .drop.go, .dcs.fresh { animation:none; } .dclock .hand { transition:none; } }
/* はじめの画面（本人 2026-10-24「ゲームスタートの Home 画面、主人公の名前を入力」）。布はウィンドウと同じ */
/* はじめの画面は 3D を見せない（本人 2026-10-24）。空色の布に キルトの縫い目 */
#home { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:16px; overflow:auto;
  background-color:#d9eef9;
  background-image:repeating-linear-gradient(0deg, transparent 0 63px, rgba(255,255,255,.75) 63px 65px), repeating-linear-gradient(90deg, transparent 0 63px, rgba(255,255,255,.75) 63px 65px),
    repeating-linear-gradient(0deg, rgba(90,120,150,.05) 0 1px, transparent 1px 4px), repeating-linear-gradient(90deg, rgba(90,120,150,.04) 0 1px, transparent 1px 4px); }
#home.fly { animation:homeFly 1.1s ease-in forwards; pointer-events:none; }
@keyframes homeFly { to { transform:scale(2.6); opacity:0; } }
.hwait { font-size:12px; color:#5a6582; margin:10px 0 0; }
/* 世界観の説明：絵本のページ */
.homeCard.book { width:min(680px,94vw); }
.book .art { position:relative; height:210px; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin:0 0 8px; }
.book .narr { font-size:18px; line-height:1.9; min-height:4.2em; text-align:left; margin:0 auto; max-width:560px; cursor:pointer; }
.book .narr .more { display:inline-block; color:var(--akane); animation:more 1s ease-in-out infinite; margin-left:4px; }
@keyframes more { 50% { transform:translateY(3px); opacity:.4; } }
.book .foot { display:flex; align-items:center; gap:10px; margin-top:12px; }
.book .dots { display:flex; gap:6px; margin-right:auto; }
.book .dots i { width:9px; height:9px; border-radius:50%; border:1.5px solid var(--ai); }
.book .dots i.on { background:var(--ai); }
.book .skip { font-size:12px; padding:5px 10px; }
.book .foot .main { font-size:16px; padding:9px 22px; }
.quilt { width:300px; height:168px; display:grid; grid-template-columns:repeat(10,1fr); border-radius:48% 52% 44% 56% / 58% 46% 54% 42%; overflow:hidden; outline:2px dashed rgba(46,58,89,.45); outline-offset:5px; animation:bob 4s ease-in-out infinite; }
.quilt i { outline:1px dashed rgba(255,255,255,.85); outline-offset:-3px; }
@keyframes bob { 50% { transform:translateY(-5px); } }
.art .cl { position:absolute; font-size:44px; color:#fff; font-variation-settings:'FILL' 1; animation:drift 9s linear infinite alternate; }
@keyframes drift { to { transform:translateX(40px); } }
.region { display:flex; flex-direction:column; align-items:center; gap:4px; width:120px; padding:10px 6px; background:#fff; border:1.5px dashed rgba(46,58,89,.45); border-radius:8px; font-size:13px; }
.region .material-symbols-outlined { font-size:40px; }
.art .faces { flex-basis:100%; display:flex; justify-content:center; gap:8px; }
.art .faces img { width:40px; height:40px; border-radius:50%; border:2px dashed var(--ai); background:#fff; }
.guildArt { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:14px; }
.guildArt .ring { width:120px; height:120px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; outline:2px dashed var(--akane); outline-offset:-8px; }

(function trapLog() {
  const keep = (lv, a) => {
    const t = new Date(), hh = [t.getHours(), t.getMinutes(), t.getSeconds()].map((x) => String(x).padStart(2, '0')).join(':');

    if (DBG.length > 300) DBG.shift();
  };
  ['log', 'info', 'warn', 'error'].forEach((lv) => { const o = console[lv].bind(console); console[lv] = (...a) => { keep(lv, a); o(...a); }; });
  addEventListener('error', (e) => keep('error', [e.message, `${e.filename || ''}:${e.lineno || ''}`]));
  addEventListener('unhandledrejection', (e) => keep('error', ['promise', e.reason && (e.reason.message || e.reason)]));
})();

}

// Canva の 絵を 256×256 の JPEG に 小さくする（まん中を 正方形に 切りぬく）
function shrinkImage(file) {
  return new Promise((ok, ng) => {
    if (!/^image\/(png|jpeg)$/.test(file.type)) { ng(new Error('PNG か JPEG の 絵を えらんでね（Canva の「ダウンロード」で PNG）')); return; }

    fr.onerror = () => ng(new Error('絵が 読めなかった。もう一度 えらんでね'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => ng(new Error('絵が 読めなかった。もう一度 えらんでね'));

        const c = document.createElement('canvas'); c.width = 256; c.height = 256; const g = c.getContext('2d');

        g.fillStyle = '#ffffff'; g.fillRect(0, 0, 256, 256); g.drawImage(im, sx, sy, sz, sz, 0, 0, 256, 256);
        let url = ''; for (const qv of [0.85, 0.7, 0.55, 0.4]) { url = c.toDataURL('image/jpeg', qv); if (url.length <= 300 * 1024 * 1.37) break; }
        if (url.length > 300 * 1024 * 1.37) { ng(new Error('絵が 大きすぎるよ')); return; }
        const el = new Image(); el.onload = () => ok({ dataUrl: url, el }); el.onerror = () => ng(new Error('絵が 読めなかった')); el.src = url;
      };
      im.src = fr.result;
